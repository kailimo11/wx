<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图文列表 | 知乎的模仿与制作</title>
  <link rel="stylesheet" href="css/wenxin_common.css" />
  <link rel="stylesheet" href="css/wenxin_gallery.css" />
</head>
<body>
  <header class="wenxin_nav">
    <div class="wenxin_navBrand">
      <span class="wenxin_navLogo">知</span>
      <span>知乎的模仿与制作</span>
    </div>
    <nav class="wenxin_navLinks">
      <a class="wenxin_navLink" href="index.html">首页</a>

      <a class="wenxin_navLink" href="news.html">科技新闻</a>
      <a class="wenxin_navLink isActive" href="gallery.html">图文列表</a>
    </nav>
  </header>

  <main class="wenxin_container">
    <div class="wenxin_pageHead">
      <h1 class="wenxin_pageTitle">图文列表</h1>
      <p class="wenxin_pageDesc">图片与说明文字均来自 MySQL 数据库 <strong>wenxin_gallery</strong> 表，由后端接口返回。</p>
    </div>

    <div class="wenxin_apiBar">
      <span class="wenxin_apiMethod">GET</span>
      <strong>后端接口：</strong>
      <a class="wenxin_apiLink" id="wenxin_galleryApiLink" href="http://localhost:8328/api/gallery" target="_blank" rel="noopener">http://localhost:8328/api/gallery?page=1&amp;pageSize=12</a>
      <button class="wenxin_jsonToggle" id="wenxin_galleryJsonToggle" type="button">查看原始数据（JSON）</button>
    </div>
    <pre class="wenxin_jsonBox wenxin_jsonHidden" id="wenxin_galleryJson">等待请求……</pre>

    <div class="wenxin_galleryToolbar">
      <div class="wenxin_categoryChips" id="wenxin_galleryChips"></div>
      <span class="wenxin_galleryCount" id="wenxin_galleryCount">共 0 条图文</span>
    </div>

    <div id="wenxin_galleryList" class="wenxin_galleryGrid">
      <div class="wenxin_loading">图文加载中……</div>
    </div>
  </main>

  <footer class="wenxin_footer">
    <p>姓名：温馨（wenxin） · 学号：24001010328 · 知乎的模仿与制作</p>
