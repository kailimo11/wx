<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>科技新闻列表 | 知乎的模仿与制作</title>
  <link rel="stylesheet" href="css/wenxin_common.css" />
  <link rel="stylesheet" href="css/wenxin_news.css" />
</head>
<body>
  <header class="wenxin_nav">
    <div class="wenxin_navBrand">
      <span class="wenxin_navLogo">知</span>
      <span>知乎的模仿与制作</span>
    </div>
    <nav class="wenxin_navLinks">
      <a class="wenxin_navLink" href="index.html">首页</a>
      <a class="wenxin_navLink" href="database.html">数据库测试</a>
      <a class="wenxin_navLink isActive" href="news.html">科技新闻</a>
      <a class="wenxin_navLink" href="gallery.html">图文列表</a>
    </nav>
  </header>

  <main class="wenxin_container">
    <div class="wenxin_pageHead">
      <h1 class="wenxin_pageTitle">科技新闻列表</h1>
      <p class="wenxin_pageDesc">新闻数据存储在 MySQL 数据库 <strong>wenxin_news</strong> 表中，由后端接口分页返回。</p>
    </div>

    <div class="wenxin_apiBar">
      <span class="wenxin_apiMethod">GET</span>
      <strong>后端接口：</strong>
      <a class="wenxin_apiLink" id="wenxin_newsApiLink" href="http://localhost:8328/api/news" target="_blank" rel="noopener">http://localhost:8328/api/news?page=1&amp;pageSize=10&amp;keyword=</a>
      <button class="wenxin_jsonToggle" id="wenxin_newsJsonToggle" type="button">查看原始数据（JSON）</button>
    </div>
    <pre class="wenxin_jsonBox wenxin_jsonHidden" id="wenxin_newsJson">等待请求……</pre>

    <div class="wenxin_newsToolbar">
      <form class="wenxin_newsSearch" id="wenxin_newsSearchForm">
        <input class="wenxin_input" id="wenxin_newsKeyword" type="search" placeholder="搜索标题 / 摘要 / 来源，例如：芯片" />
        <button class="wenxin_btn" type="submit">搜索</button>
      </form>
      <span class="wenxin_newsCount" id="wenxin_newsCount">共 0 条新闻</span>
    </div>

    <div id="wenxin_newsList" class="wenxin_newsList">
      <div class="wenxin_loading">新闻加载中……</div>
    </div>

    <div class="wenxin_pager" id="wenxin_newsPager"></div>
  </main>

  <footer class="wenxin_footer">
    <p>姓名：温馨（wenxin） · 学号：24001010328 · 知乎的模仿与制作</p>
  </footer>

  <script src="js/wenxin_news.js"></script>
</body>
</html>
