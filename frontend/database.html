<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据库连接测试 | 知乎的模仿与制作</title>
  <link rel="stylesheet" href="css/wenxin_common.css" />
  <link rel="stylesheet" href="css/wenxin_database.css" />
</head>
<body>
  <header class="wenxin_nav">
    <div class="wenxin_navBrand">
      <span class="wenxin_navLogo">知</span>
      <span>知乎的模仿与制作</span>
    </div>
    <nav class="wenxin_navLinks">
      <a class="wenxin_navLink" href="index.html">首页</a>
      <a class="wenxin_navLink isActive" href="database.html">数据库测试</a>
      <a class="wenxin_navLink" href="news.html">科技新闻</a>
      <a class="wenxin_navLink" href="gallery.html">图文列表</a>
    </nav>
  </header>

  <main class="wenxin_container">
    <div class="wenxin_pageHead">
      <h1 class="wenxin_pageTitle">数据库连接测试</h1>
      <p class="wenxin_pageDesc">输入 MySQL 账号密码后提交，后端将使用该凭据真实建立连接并返回服务器信息。</p>
    </div>

    <div class="wenxin_dbLayout">
      <section class="wenxin_card wenxin_dbForm">
        <h2 class="wenxin_dbFormTitle">连接参数</h2>
        <form id="wenxin_dbForm" autocomplete="off">
          <div class="wenxin_field">
            <label class="wenxin_label" for="wenxin_dbUser">用户名</label>
            <input class="wenxin_input" id="wenxin_dbUser" name="user" type="text" value="root" placeholder="请输入数据库用户名" required />
          </div>
          <div class="wenxin_field">
            <label class="wenxin_label" for="wenxin_dbPassword">密码</label>
            <input class="wenxin_input" id="wenxin_dbPassword" name="password" type="password" value="root" placeholder="请输入数据库密码" required />
          </div>
          <div class="wenxin_field">
            <label class="wenxin_label" for="wenxin_dbHost">主机地址</label>
            <input class="wenxin_input" id="wenxin_dbHost" name="host" type="text" value="localhost" placeholder="例如 localhost" />
          </div>
          <div class="wenxin_field">
            <label class="wenxin_label" for="wenxin_dbName">数据库名（可选）</label>
            <input class="wenxin_input" id="wenxin_dbName" name="database" type="text" value="wenxin_zhihu" placeholder="例如 wenxin_zhihu" />
          </div>
          <div class="wenxin_dbActions">
            <button class="wenxin_btn" id="wenxin_dbSubmit" type="submit">测试连接</button>
            <button class="wenxin_btn wenxin_btnGhost" id="wenxin_dbReset" type="reset">重置为默认值</button>
          </div>
        </form>

        <div class="wenxin_apiBar wenxin_dbApi">
          <span class="wenxin_apiMethod">POST</span>
          <strong>接口：</strong>
          <a class="wenxin_apiLink" id="wenxin_dbApiLink" href="http://localhost:8328/api/db/test" target="_blank" rel="noopener">http://localhost:8328/api/db/test</a>
        </div>
      </section>

      <section class="wenxin_card wenxin_dbResult">
        <h2 class="wenxin_dbFormTitle">连接结果</h2>
        <div id="wenxin_dbFeedback" class="wenxin_alert wenxin_alertInfo">
          尚未测试。填写参数后点击「测试连接」，默认账号 root / root。
        </div>
        <div class="wenxin_dbResultBody">
          <h3 class="wenxin_dbSubTitle">服务器返回数据（JSON）</h3>
          <pre class="wenxin_jsonBox" id="wenxin_dbJson">等待请求……</pre>
        </div>
      </section>
    </div>
  </main>

  <footer class="wenxin_footer">
    <p>姓名：温馨（wenxin） · 学号：24001010328 · 知乎的模仿与制作</p>
  </footer>

  <script src="js/wenxin_database.js"></script>
</body>
</html>
